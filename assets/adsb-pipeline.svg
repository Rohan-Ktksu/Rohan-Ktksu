<svg xmlns="http://www.w3.org/2000/svg" width="660" height="482" viewBox="0 0 660 482" role="img" aria-labelledby="title desc">
  <title id="title">Butterflyts: ADS-B analysis pipeline</title>
  <desc id="desc">Live ADS-B signals are collected and cleaned, analyzed using runway context and position metrics, then combined into pattern classification and visualizations.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111E2D"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6776A1"/><stop offset="1" stop-color="#416D74"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#8FCFC6"/></marker>
  </defs>
  <rect width="660" height="482" rx="24" fill="url(#canvas)" />
  <rect x="1" y="1" width="658" height="480" rx="23" fill="none" stroke="#33445D" opacity="0.75" />
  <text x="330" y="34" text-anchor="middle" fill="#8EB9CE" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="2.4">BUTTERFLYTS  /  DATA FLOW</text>
  <!-- Connector paths are drawn first so they run behind the nodes -->
  <g fill="none" stroke="#8FCFC6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M330 114 V132" marker-end="url(#arrow)"/>
    <path d="M330 198 V219 H170 V238" marker-end="url(#arrow)"/>
    <path d="M330 219 H490 V238" marker-end="url(#arrow)"/>
    <path d="M170 316 V343 H330 V369" marker-end="url(#arrow)"/>
    <path d="M490 316 V343 H330"/>
  </g>
  <rect x="150" y="55" width="360" height="59" rx="12" fill="url(#header)" stroke="#9FB4E8" stroke-opacity="0.55" />
  <text x="330" y="78" font-size="11" fill="#D7E4F1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" letter-spacing="1">01  /  SOURCE</text>
  <text x="330" y="101" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="Arial,sans-serif">Live ADS-B data</text>
  <rect x="150" y="139" width="360" height="59" rx="12" fill="#1B2B3E" stroke="#5F7798" />
  <text x="330" y="163" font-size="11" fill="#8FCFC6" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" letter-spacing="1">02  /  PREPARE</text>
  <text x="330" y="185" font-size="19" font-weight="600" fill="#E5EAF6" text-anchor="middle" font-family="Arial,sans-serif">Collect &amp; clean positions</text>
  <rect x="25" y="240" width="290" height="76" rx="12" fill="#1B2B3E" stroke="#5F7798" />
  <text x="170" y="263" font-size="11" fill="#8FCFC6" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" letter-spacing="1">03A / CONTEXT</text>
  <text x="170" y="287" font-size="18" font-weight="600" fill="#E5EAF6" text-anchor="middle" font-family="Arial,sans-serif">Airport &amp; runway</text>
  <text x="170" y="302" font-size="12" fill="#AEBBCF" text-anchor="middle" font-family="Arial,sans-serif">geospatial reference data</text>
  <rect x="345" y="240" width="290" height="76" rx="12" fill="#1B2B3E" stroke="#5F7798" />
  <text x="490" y="263" font-size="11" fill="#8FCFC6" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" letter-spacing="1">03B / MEASURE</text>
  <text x="490" y="287" font-size="18" font-weight="600" fill="#E5EAF6" text-anchor="middle" font-family="Arial,sans-serif">Distance &amp; bearing</text>
  <text x="490" y="302" font-size="12" fill="#AEBBCF" text-anchor="middle" font-family="Arial,sans-serif">movement and trajectories</text>
  <rect x="122" y="375" width="416" height="73" rx="12" fill="#21313E" stroke="#8FCFC6" stroke-opacity="0.85" />
  <text x="330" y="399" font-size="11" fill="#8FCFC6" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" letter-spacing="1">04  /  INSIGHT</text>
  <text x="330" y="422" font-size="18" font-weight="600" fill="#E5EAF6" text-anchor="middle" font-family="Arial,sans-serif">Classify patterns &amp; visualize</text>
  <text x="330" y="438" font-size="12" fill="#AEBBCF" text-anchor="middle" font-family="Arial,sans-serif">from real-time tracking to historical analysis</text>
</svg>
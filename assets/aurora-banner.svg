<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Rohan — creative developer profile</title>
  <desc id="desc">A midnight-blue aurora sky, delicate stars and a luminous aircraft flight path. Rohan. Build with curiosity.</desc>
  <defs>
    <linearGradient id="night" x1="0" x2="1" y1="0.15" y2="0.95">
      <stop offset="0" stop-color="#0A1225"/>
      <stop offset="0.55" stop-color="#172240"/>
      <stop offset="1" stop-color="#26234A"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#86E3CF" stop-opacity="0.04"/>
      <stop offset="0.4" stop-color="#83BCE0" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#C7A7EB" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#D9B7DE" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" x2="1">

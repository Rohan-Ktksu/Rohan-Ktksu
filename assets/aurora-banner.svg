      <stop offset=".45" stop-color="#B8B8FA" stop-opacity=".6"/>
      <stop offset="1" stop-color="#B8B8FA" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#C9B7EF" stop-opacity=".25"/><stop offset="1" stop-color="#C9B7EF" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="tinyGlow"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

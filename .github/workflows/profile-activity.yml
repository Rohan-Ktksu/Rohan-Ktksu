name: Refresh public GitHub activity

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public GitHub activity and generate SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_activity.py
      - name: Commit refreshed graphic if changed
        run: |
          if git diff --quiet -- assets/github-activity.svg && [ -f assets/github-activity.svg ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(profile): refresh public activity counts"
          git push
